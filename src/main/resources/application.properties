# Spring Boot Configuration
spring.application.name=qr-attendance
server.port=${PORT:8080}

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:attendance.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Attendance QR Code URL Configuration (Set to your cloud URL or local IP)
app.attendance-url=${APP_ATTENDANCE_URL:http://localhost:8080/attendance}

